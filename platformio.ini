; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
build_unflags =
    -std=gnu++11
check_flags = 
	cppcheck: --enable=all --inline-suppr --suppress=*:*/.pio/*
monitor_filters =
    esp32_exception_decoder
    time
    default

[display_common]
build_flags =
    -std=c++17
    -std=gnu++17
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_CONF_PATH="${platformio.src_dir}/display/lv_conf.h"
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DLV_CONF_SUPPRESS_DEFINE_CHECK
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_CMN
    -O2
    -DCONFIG_MAX_FILENAME_LEN=64
    -DCONFIG_MAX_URL_LEN=128
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=2
    -DCONFIG_BT_NIMBLE_PINNED_TO_CORE=0
    ; Run AsyncTCP on core 0, same core as the WiFi MAC and LWIP tcpip thread.
    ; Driving LWIP from a different core than the WiFi/RX path (core 1) risks
    ; cross-core LWIP races under load that wedge the whole IP stack (web + ICMP
    ; die together). v1.8.1 used core 0 and was stable; the BLE load that
    ; originally motivated moving it off core 0 is now much lower (idle 30-50ms
    ; connection interval + fire-and-forget telemetry).
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
    -DCONFIG_ASYNC_TCP_MAX_ACK_TIME=5000
    -DCONFIG_ASYNC_TCP_PRIORITY=10
    -DCONFIG_ASYNC_TCP_QUEUE_SIZE=64
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
    -DDEFAULT_MAX_WS_CLIENTS=3
lib_deps_default =
    FS
    SPIFFS
    LittleFS
    Wire
    SPI
    ble_ota_dfu
    NanoPbComm
    h2zero/NimBLE-Arduino@^2.5.1
    nanopb/Nanopb@^0.4.9
    https://github.com/ESP32Async/AsyncTCP.git#v3.4.9
    https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.9.1
    bblanchon/ArduinoJson@^7.2.1
    256dpi/MQTT@^2.5.2
    https://github.com/gaggimate/esp-arduino-ble-scales#v2.0.0
    homespan/HomeSpan@^2.1.8
    jnthas/Improv WiFi Library@^0.0.4

; pioarduino "hybrid" build: rebuilds the prebuilt Arduino/IDF libraries with these sdkconfig
; overrides. The first build downloads framework-espidf, cmake and ninja and compiles the libs
; (~3 min here); later builds reuse them. The stock qio_opi config keeps the NimBLE host, the
; Wi-Fi/LWIP buffers and TLS in internal RAM, which left 14 KB free on the T-RGB versus 81 KB
; on Arduino 2 (see CLAUDE.md). The rebuilt libs are keyed on this text plus the board's
; memory layout, so every ESP env must reference this same block: an env without it reverts
; the framework to stock libs, and a different block means a rebuild on every switch.
; controller, display and display-headless (qio_opi) share one lib set; display-headless-8m
; (qio_qspi) has its own and re-triggers the compile step when alternated with the others.
; BLE controller/host sizing: the display holds one controller link plus one scale while scanning,
; so the hub-sized defaults (6 activities, 100-entry caches, 3 connections) only cost internal RAM
; (GET /api/debug/heap put BLE init at 48 KB on 2026-09-02). esp_timer's 8 KB stack had 7.7 KB unused.
; Disabling an option is not possible from this ini block: kconfig's "# CONFIG_X is not set" line is
; an ini comment here and "CONFIG_X=n" is ignored by the merge. To turn one off (e.g. the BLE mesh
; duplicate-scan cache, CONFIG_BT_CTRL_BLE_MESH_SCAN_DUPL_EN, ~3 KB), move this block to a file and
; reference it as `custom_sdkconfig = file://sdkconfig.custom`.
[custom_sdk]
custom_sdkconfig =
    CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL=y
    CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
    CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
    CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=32768
    CONFIG_BT_CTRL_BLE_MAX_ACT=4
    CONFIG_BT_CTRL_BLE_ADV_REPORT_FLOW_CTRL_NUM=50
    CONFIG_BT_CTRL_SCAN_DUPL_CACHE_SIZE=30
    CONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
    CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
    CONFIG_LWIP_TCPIP_TASK_STACK_SIZE=3072
    CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
    CONFIG_GDMA_ISR_IRAM_SAFE=y

[env:display]
; cppcheck (PlatformIO's bundled build) cannot parse the GCC 14 libstdc++ headers that ship with
; pioarduino's toolchain and reports a "breaking" syntax error in every file, so keep package
; (toolchain/framework) include paths out of the analysis. CI's check.yml relies on this.
check_skip_packages = yes
board = LilyGo-T-RGB
board_build.filesystem = littlefs
; Code and read-only data are copied into PSRAM at boot (~4.4 MB of the 8 MB). With nothing fetched
; from flash, the flash driver no longer disables the cache around erases and page writes
; (spi_flash_os_func_app.c: SPI_FLASH_CACHE_NO_DISABLE), so PSRAM, the framebuffer and the panel's
; bounce buffers stay reachable while the shot log or an OTA image is written: that was the tearing
; during shots. Works on any flash chip, unlike flash auto-suspend (tried, see commit ccec8eac).
; This block differs from the shared one, so `display` owns a separate set of rebuilt IDF libraries.
custom_sdkconfig =
    ${custom_sdk.custom_sdkconfig}
    CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
    CONFIG_SPIRAM_RODATA=y
upload_speed = 921600
build_src_filter = -<*> +<display/> +<version.h>
extra_scripts =
	pre:scripts/auto_firmware_version.py
	; Ensures src/display/webassets/* (embedded web UI) exists before compile;
	; stubs an empty bundle if build_webui.sh hasn't been run. [GM-106]
	pre:scripts/embed_webui_pre.py
	; .incbin dependencies are invisible to SCons, so a stale web_ui_blob.S.o can
	; silently ship a 1-byte bundle that serves garbage. Fail the build instead.
	post:scripts/check_webui_blob.py
; nanopb's official PlatformIO integration generates gaggimate.pb.{c,h} from the
; .proto at build time (no committed generated files, no separate generator
; script). The matching gaggimate.options is picked up automatically.
custom_nanopb_protos =
	+<lib/NanoPbComm/proto/gaggimate.proto>
custom_nanopb_options =
	--error-on-unmatched
lib_deps =
    ${display_common.lib_deps_default}
    lewisxhe/SensorLib @ 0.4.1
	lvgl/lvgl @ 8.4.0
	moononournation/GFX Library for Arduino @ 1.6.7
build_flags =
    ${display_common.build_flags}

; Debug-only twin of `display` with ESP-IDF's standalone heap tracer compiled in and started from a
; global constructor (src/display/core/HeapTrace.cpp), so every live allocation can be attributed to
; its call site: GET /api/debug/heap/trace + scripts/heap_trace_report.py. Never ship it: every
; malloc pays a 12-frame backtrace. Its sdkconfig block differs from the shared one, so alternating
; it with `display` re-triggers the ~3 min library compile each time.
[env:display-heaptrace]
extends = env:display
custom_sdkconfig =
    ${env:display.custom_sdkconfig}
    CONFIG_HEAP_TRACING_STANDALONE=y
    CONFIG_HEAP_TRACING_STACK_DEPTH=12
    CONFIG_HEAP_TRACE_HASH_MAP=y
    CONFIG_HEAP_TRACE_HASH_MAP_IN_EXT_RAM=y
    CONFIG_HEAP_TRACE_HASH_MAP_SIZE=4096
build_flags =
    ${env:display.build_flags}
    -DGM_HEAP_TRACE

[env:display-headless]
custom_sdkconfig = ${custom_sdk.custom_sdkconfig}
extends = env:display
lib_deps =
    ${display_common.lib_deps_default}
build_flags =
    ${display_common.build_flags}
    -DGAGGIMATE_HEADLESS
build_src_filter = -<*> +<display/> +<version.h> -<display/drivers/> -<display/ui/> -<display/lv_conf.h>

[env:display-headless-8m]
custom_sdkconfig = ${custom_sdk.custom_sdkconfig}
extends = env:display-headless
board = seeed_xiao_esp32s3

[env:controller]
; cppcheck (PlatformIO's bundled build) cannot parse the GCC 14 libstdc++ headers that ship with
; pioarduino's toolchain and reports a "breaking" syntax error in every file, so keep package
; (toolchain/framework) include paths out of the analysis. CI's check.yml relies on this.
check_skip_packages = yes
custom_sdkconfig = ${custom_sdk.custom_sdkconfig}
board = Gaggimate-Controller
build_src_filter = -<*> +<controller/> +<version.h>
extra_scripts =
    pre:scripts/auto_firmware_version.py
custom_nanopb_protos =
	+<lib/NanoPbComm/proto/gaggimate.proto>
custom_nanopb_options =
	--error-on-unmatched
lib_deps =
	GaggiMateController
	FS
	SPIFFS
	ble_ota_dfu
	NanoPbComm
	h2zero/NimBLE-Arduino@^2.5.1
	nanopb/Nanopb@^0.4.9
	bblanchon/ArduinoJson@^7.2.1
build_flags =
    -std=c++17
    -std=gnu++17
	-DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1

; Native-host env for Autotune SIMC unit tests. Autotune.cpp = STL-only, so
; `pio test -e native_autotune` runs host-side, no ESP32/Arduino runtime.
; Unity framework shipped with PlatformIO.
[env:native_autotune]
platform = native
framework =
lib_ldf_mode = off
lib_deps =
	throwtheswitch/Unity@^2.6.0
test_framework = unity
test_filter = test_autotune_simc
; Test TU includes Autotune.cpp directly (see #include at top of
; test_autotune_simc.cpp) — native linker skips NayrodPID's Arduino-dependent
; siblings (SimplePID, SimpleKalmanFilter, ...).
build_unflags =
	-std=gnu++11
build_flags =
	-std=c++17
	-I lib/NayrodPID/src
	-Wno-unused-variable
	-Wno-unused-function

; Desktop simulator: builds the real display firmware natively with the BLE link
; to the controller mocked (sim/comms) and an SDL window as the panel (sim/driver).
; All host shims for Arduino/ESP/FreeRTOS/FS/Preferences/WiFi live in sim/platform.
; Requires SDL2 on the host (macOS: `brew install sdl2`). See sim/README.md. [GM-107]
[env:display-sim]
platform = native
framework =
lib_ldf_mode = off
; Adds a clickable "Run Simulator" task (pio run -e display-sim -t run).
; The pre hook guarantees a bundle exists and clears a stale .incbin object --
; sim/web/web_ui_blob_sim.S has no digest stamp, so without it the simulator
; keeps serving whatever bundle was current when it was first assembled.
extra_scripts =
	pre:scripts/embed_webui_pre.py
	post:scripts/sim_run.py
build_src_filter =
	-<*>
	+<display/>
	+<version.h>
	+<../sim/>
	-<display/main.cpp>
	-<display/drivers/>
	-<display/webassets/>
	-<display/plugins/MQTTPlugin.cpp>
	-<display/plugins/HomekitPlugin.cpp>
	-<display/plugins/HomekitBridge.cpp>
	-<display/plugins/mDNSPlugin.cpp>
	-<display/plugins/NetworkWatchdogPlugin.cpp>
	-<display/plugins/WifiStaWatchdogPlugin.cpp>
	-<display/plugins/BLEScalePlugin.cpp>
	-<display/plugins/ImprovPlugin.cpp>
lib_deps =
	lvgl/lvgl@8.4.0
	bblanchon/ArduinoJson@^7.2.1
build_unflags =
	-std=gnu++11
build_flags =
	-DGAGGIMATE_SIM
	-std=gnu++17
	-DLV_CONF_INCLUDE_SIMPLE
	-DLV_CONF_PATH="${platformio.src_dir}/display/lv_conf.h"
	-DLV_CONF_SUPPRESS_DEFINE_CHECK
	-DDISABLE_ALL_LIBRARY_WARNINGS
	-DCORE_DEBUG_LEVEL=0
	; Make ArduinoJson auto-configure exactly as on the device (Arduino String,
	; no std::string) so its overload resolution matches the firmware.
	-DARDUINO=10812
	; Path to the embedded WebUI blob, .incbin'd by sim/web/web_ui_blob_sim.S.
	-DGM_WEB_UI_BIN=\"${PROJECT_DIR}/src/display/webassets/web_ui.bin\"
	-I ${PROJECT_DIR}/sim/platform
	-I ${PROJECT_DIR}/sim/platform/arduino
	-I ${PROJECT_DIR}/sim/comms
	-I ${PROJECT_DIR}/sim/driver
	-I ${PROJECT_DIR}/sim/web
	-I ${PROJECT_DIR}/src
	!sdl2-config --cflags
	!sdl2-config --libs
